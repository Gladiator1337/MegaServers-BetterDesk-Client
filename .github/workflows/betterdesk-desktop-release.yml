# BetterDesk Client (full / clean desktop) — build + development prerelease.
#
# Builds the official BetterDesk desktop client after each update on master
# (and on desktop/* tags / manual dispatch). Publishes a small prerelease with
# changelog notes about recent development.
#
# Out of scope (intentionally NOT built here):
#   - BetterDesk Support Agent (product_sku=betterdesk-support / incoming-only).
#     Support is produced later by the console Generator from clean templates
#     + custom.txt — never as a separate GitHub Actions bake-in job.
#
name: BetterDesk desktop release

on:
  push:
    branches:
      - master
    tags:
      - "desktop/*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - "PRIVACY"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. desktop/1.5.0 or desktop/dev-manual)"
        required: true
        default: "desktop/dev-manual"

concurrency:
  group: betterdesk-desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "1.5.0"
  # Clean full client only — never bake Support Agent custom.txt in CI.
  PRODUCT: betterdesk-desktop
  PRODUCT_SKU: betterdesk-desktop

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_dev: ${{ steps.meta.outputs.is_dev }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag and changelog range
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          RUN_N="${GITHUB_RUN_NUMBER}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            IS_DEV=true
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            # Tagged desktop/* releases are still prereleases unless name omits "dev"
            if echo "${TAG_NAME}" | grep -Eqi 'dev|nightly|snapshot'; then
              IS_DEV=true
            else
              IS_DEV=false
            fi
          else
            # Push to master → development prerelease per update
            TAG_NAME="desktop/${VERSION}-dev.${RUN_N}-${SHORT_SHA}"
            IS_DEV=true
          fi

          if [ "${IS_DEV}" = "true" ]; then
            RELEASE_NAME="BetterDesk Client ${VERSION} (dev ${RUN_N})"
          else
            RELEASE_NAME="BetterDesk Client ${VERSION}"
          fi

          # Previous BetterDesk desktop tag for changelog (fallback: last 20 commits)
          PREV="$(git describe --tags --abbrev=0 --match 'desktop/*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -z "${PREV}" ]; then
            PREV="$(git rev-list --max-count=1 HEAD~20 2>/dev/null || echo "")"
          fi

          {
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
            echo "is_dev=${IS_DEV}"
            echo "previous_tag=${PREV}"
          } >> "${GITHUB_OUTPUT}"

          echo "tag_name=${TAG_NAME}"
          echo "release_name=${RELEASE_NAME}"
          echo "is_dev=${IS_DEV}"
          echo "previous_tag=${PREV}"

  build:
    needs: prepare
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ needs.prepare.outputs.tag_name }}
    secrets: inherit

  prepare-macos-generator:
    name: Prepare macOS generator app (${{ matrix.arch }})
    needs: build
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Download unsigned macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-macos-${{ matrix.arch }}
          path: dmg-artifact

      - name: Extract app bundle for generator
        shell: bash
        run: |
          set -euo pipefail

          dmg="$(find dmg-artifact -type f -name '*.dmg' | head -n1 || true)"
          if [ -z "${dmg}" ]; then
            echo "No DMG found for ${{ matrix.arch }}"
            exit 1
          fi

          mkdir -p mount generator
          hdiutil attach "${dmg}" -nobrowse -readonly -mountpoint "$PWD/mount"
          trap 'hdiutil detach "$PWD/mount" -force >/dev/null 2>&1 || true' EXIT

          app="$(find "$PWD/mount" -maxdepth 1 -type d -name '*.app' | head -n1 || true)"
          if [ -z "${app}" ]; then
            echo "No .app bundle found in ${dmg}"
            exit 1
          fi

          executable="$(find "${app}/Contents/MacOS" -maxdepth 1 -type f | head -n1 || true)"
          if [ -z "${executable}" ]; then
            echo "No macOS executable found in ${app}/Contents/MacOS"
            exit 1
          fi

          export COPYFILE_DISABLE=1
          archive="$PWD/generator/betterdesk-generator-macos-${{ matrix.arch }}.tar.gz"
          tar -czf "${archive}" -C "$PWD/mount" "$(basename "${app}")"

          hdiutil detach "$PWD/mount"
          trap - EXIT

      - name: Upload macOS generator app
        uses: actions/upload-artifact@v4
        with:
          name: betterdesk-generator-macos-${{ matrix.arch }}
          path: generator/betterdesk-generator-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  package-clean-and-release:
    name: Package clean BetterDesk Client + release notes
    needs: [prepare, build, prepare-macos-generator]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows unsigned
        uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-unsigned-windows-*
          path: dist-raw
          merge-multiple: false
        continue-on-error: true

      - name: Download MSI templates
        uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-unsigned-msi-template-*
          path: dist-raw/msi-template-arts
          merge-multiple: true
        continue-on-error: true

      - name: Download macOS unsigned
        uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-unsigned-macos-*
          path: dist-raw
          merge-multiple: false
        continue-on-error: true

      - name: Download macOS generator apps
        uses: actions/download-artifact@v4
        with:
          pattern: betterdesk-generator-macos-*
          path: dist-raw/macos-generator
          merge-multiple: false

      - name: Download Linux debs
        uses: actions/download-artifact@v4
        with:
          pattern: "rustdesk-${{ env.VERSION }}-*.deb"
          path: dist-raw/linux-debs
          merge-multiple: true
        continue-on-error: true

      - name: Download Linux rpms
        uses: actions/download-artifact@v4
        with:
          pattern: "rustdesk-${{ env.VERSION }}-*-rpms"
          path: dist-raw/linux-rpms
          merge-multiple: true
        continue-on-error: true

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          pattern: betterdesk-windows-installers-*
          path: dist-raw/windows-installers
          merge-multiple: true
        continue-on-error: true

      - name: Normalize BetterDesk layout (full client only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/{windows-x86_64,windows-aarch64,linux-x86_64,linux-aarch64,macos-x86_64,macos-aarch64,msi-template,clean}

          # Windows folders from CI still named rustdesk-unsigned-windows-*
          for arch in x86_64 aarch64; do
            src=$(find dist-raw -maxdepth 2 -type d -name "rustdesk-unsigned-windows-${arch}" | head -n1 || true)
            if [ -n "${src}" ]; then
              cp -a "${src}/." "dist/windows-${arch}/"
              # Prefer betterdesk.exe; fall back to rename rustdesk.exe
              if [ -f "dist/windows-${arch}/rustdesk.exe" ] && [ ! -f "dist/windows-${arch}/betterdesk.exe" ]; then
                mv "dist/windows-${arch}/rustdesk.exe" "dist/windows-${arch}/betterdesk.exe"
              fi
              # Never ship Support Agent bake-in from CI
              rm -f "dist/windows-${arch}/custom.txt"
              tar -C "dist/windows-${arch}" -czf "dist/clean/betterdesk-${VERSION}-windows-${arch}.tar.gz" .
            fi
          done

          # Portable EXE + MSI installers (standard full client, not incoming-only)
          if [ -d dist-raw/windows-installers ]; then
            find dist-raw/windows-installers -type f \( -name 'betterdesk-*.exe' -o -name 'betterdesk-*.msi' \) \
              -exec cp {} dist/clean/ \;
          fi

          if [ -d dist-raw/msi-template-arts ]; then
            find dist-raw/msi-template-arts -name '*.msi' -exec cp {} dist/msi-template/ \;
            for f in dist/msi-template/rustdesk-template-*.msi; do
              [ -f "$f" ] || continue
              base=$(basename "$f" | sed 's/rustdesk-template/betterdesk-template/')
              mv "$f" "dist/msi-template/${base}"
            done
          fi

          # Keep the DMG as a clean release asset, but feed an extracted .app
          # bundle to the console Generator so custom.txt reaches Contents/MacOS.
          for arch in x86_64 aarch64; do
            dmg="$(find dist-raw -type f -path "*rustdesk-unsigned-macos-${arch}*" -name '*.dmg' | head -n1 || true)"
            if [ -n "${dmg}" ]; then
              cp "${dmg}" "dist/clean/betterdesk-${VERSION}-macos-${arch}.dmg"
            fi

            archive="$(find dist-raw/macos-generator -type f -name "betterdesk-generator-macos-${arch}.tar.gz" | head -n1 || true)"
            if [ -z "${archive}" ]; then
              echo "Missing macOS generator archive for ${arch}"
              exit 1
            fi

            rm -rf "dist/macos-${arch}"
            mkdir -p "dist/macos-${arch}"
            tar -xzf "${archive}" -C "dist/macos-${arch}"
            find "dist/macos-${arch}" -name custom.txt -delete || true

            app="$(find "dist/macos-${arch}" -maxdepth 2 -type d -name '*.app' | head -n1 || true)"
            if [ -z "${app}" ]; then
              echo "macOS ${arch}: extracted generator template has no .app bundle"
              exit 1
            fi
            if ! find "${app}/Contents/MacOS" -maxdepth 1 -type f -print -quit | grep -q .; then
              echo "macOS ${arch}: .app bundle has no executable"
              exit 1
            fi

            tar -C "dist/macos-${arch}" -czf "dist/clean/betterdesk-${VERSION}-macos-${arch}.tar.gz" .
          done

          # Flatten the executable directory into the template root so the
          # Generator places custom.txt beside the BetterDesk binary.
          for arch in x86_64 aarch64; do
            deb="$(find dist-raw/linux-debs -name "*${arch}*.deb" 2>/dev/null | head -n1 || true)"
            if [ -n "${deb}" ]; then
              cp "${deb}" "dist/clean/betterdesk-${VERSION}-linux-${arch}.deb"

              root="dist-raw/linux-root-${arch}"
              rm -rf "${root}" "dist/linux-${arch}"
              mkdir -p "${root}" "dist/linux-${arch}"

              if command -v dpkg-deb >/dev/null; then
                dpkg-deb -x "${deb}" "${root}"
                bin="$(find "${root}" -type f \( -name betterdesk -o -name rustdesk \) | head -n1 || true)"
                if [ -z "${bin}" ]; then
                  echo "Linux ${arch}: no betterdesk/rustdesk executable found in ${deb}"
                  exit 1
                fi

                cp -a "$(dirname "${bin}")/." "dist/linux-${arch}/"
                if [ -f "dist/linux-${arch}/rustdesk" ] && [ ! -f "dist/linux-${arch}/betterdesk" ]; then
                  mv "dist/linux-${arch}/rustdesk" "dist/linux-${arch}/betterdesk"
                fi
                rm -f "dist/linux-${arch}/custom.txt"

                if [ ! -f "dist/linux-${arch}/betterdesk" ]; then
                  echo "Linux ${arch}: flattened template has no betterdesk executable"
                  exit 1
                fi
                tar -C "dist/linux-${arch}" -czf "dist/clean/betterdesk-${VERSION}-linux-${arch}-portable.tar.gz" .
              else
                echo "dpkg-deb not found"
                exit 1
              fi
            fi
            # Fedora / openSUSE RPMs when present
            if [ -d dist-raw/linux-rpms ]; then
              rpm=$(find dist-raw/linux-rpms -name "*${arch}*.rpm" ! -name '*-suse.rpm' 2>/dev/null | head -n1 || true)
              suse=$(find dist-raw/linux-rpms -name "*${arch}*-suse.rpm" 2>/dev/null | head -n1 || true)
              [ -n "${rpm}" ] && cp "${rpm}" "dist/clean/betterdesk-${VERSION}-linux-${arch}.rpm"
              [ -n "${suse}" ] && cp "${suse}" "dist/clean/betterdesk-${VERSION}-linux-${arch}-suse.rpm"
            fi
          done

          for arch in x86_64 aarch64; do
            test -f "dist/windows-${arch}/betterdesk.exe" || {
              echo "Windows ${arch}: betterdesk.exe missing"
              exit 1
            }
            test -f "dist/linux-${arch}/betterdesk" || {
              echo "Linux ${arch}: betterdesk missing"
              exit 1
            }
            find "dist/macos-${arch}" -maxdepth 2 -type d -name '*.app' -print -quit | grep -q . || {
              echo "macOS ${arch}: .app missing"
              exit 1
            }
          done

          # Guard: never publish Support Agent bake-ins from CI
          if find dist/clean dist/msi-template dist/generator-templates* \
              \( -iname '*betterdesk-support*' -o -iname '*incoming-only*' -o -name 'custom.txt' \) \
              2>/dev/null | grep -q .; then
            echo "Refusing to publish Support Agent / bake-in artifacts from CI:" >&2
            find dist/clean dist/msi-template dist/generator-templates* \
              \( -iname '*betterdesk-support*' -o -iname '*incoming-only*' -o -name 'custom.txt' \) \
              2>/dev/null >&2 || true
            exit 1
          fi

          ls -laR dist | sed -n '1,200p'

      - name: Pack generator templates (clean binaries only)
        shell: bash
        run: |
          # Templates are clean trees for the console Generator — not a Support build.
          # Support Agent custom.txt is applied by the panel, never in this workflow.
          python3 scripts/pack_generator_templates.py \
            --dist-root dist \
            --out dist/generator-templates \
            --version "${VERSION}" \
            --archive
          cp dist/generator-templates-*.tar.gz dist/clean/ || true
          cp dist/generator-templates/manifest.json dist/clean/betterdesk-${VERSION}-generator-manifest.json || true

      - name: Validate packed generator templates
        shell: bash
        run: |
          set -euo pipefail

          for arch in x86_64 aarch64; do
            test -f "dist/generator-templates/windows-${arch}/betterdesk.exe"
            test -f "dist/generator-templates/linux-${arch}/betterdesk"

            app="$(find "dist/generator-templates/macos-${arch}" -maxdepth 2 -type d -name '*.app' | head -n1 || true)"
            test -n "${app}"
            test -d "${app}/Contents/MacOS"

            test -f "dist/generator-templates/windows-${arch}/.custom-txt-here"
            test -f "dist/generator-templates/linux-${arch}/.custom-txt-here"
            find "${app}/Contents/MacOS" -maxdepth 1 -name '.custom-txt-here' -print -quit | grep -q .
          done

      - name: Write clean desktop manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          root = Path("dist/clean")
          assets = []
          for p in sorted(root.glob("betterdesk-*")):
              if p.name.endswith("manifest.json"):
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assets.append({"name": p.name, "sha256": h, "size": p.stat().st_size})
          manifest = {
              "schema_version": 1,
              "product": os.environ.get("PRODUCT", "betterdesk-desktop"),
              "sku": os.environ.get("PRODUCT_SKU", "betterdesk-desktop"),
              "variant": "clean",
              "version": version,
              "note": (
                  "Official BetterDesk Client (full). No custom.txt / no Support Agent bake-in. "
                  "Configure Settings → Network or use console Generator templates for Support."
              ),
              "assets": assets,
          }
          Path("dist/clean/betterdesk-desktop-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Build release notes
        id: notes
        shell: bash
        env:
          PREV: ${{ needs.prepare.outputs.previous_tag }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          IS_DEV: ${{ needs.prepare.outputs.is_dev }}
        run: |
          set -euo pipefail
          RANGE="${GITHUB_SHA}"
          if [ -n "${PREV}" ]; then
            RANGE="${PREV}..${GITHUB_SHA}"
          fi

          {
            echo "## ${RELEASE_NAME}"
            echo
            echo "Official **BetterDesk Client** development build (\`product_sku=betterdesk-desktop\`)."
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tag: \`${TAG_NAME}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### Scope"
            echo
            echo "- ✅ Full / clean desktop agents: Windows / Linux / macOS (x86_64 + aarch64 when available)"
            echo "- ✅ Installers (MSI / EXE / DEB / RPM / DMG) and portable archives — **no** incoming-only bake-in"
            echo "- ✅ Generator templates (clean binaries for the console — no \`custom.txt\`)"
            echo "- ❌ BetterDesk Support Agent is **not** built in GitHub Actions (panel Generator + \`custom.txt\` only)"
            echo "- ❌ No Android / iOS / AppImage / Flatpak / Sciter / web CI jobs"
            echo
            echo "### Development changes"
            echo
            if git rev-parse --verify "${PREV}" >/dev/null 2>&1 || git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
              git log --pretty=format:'- %s (%h)' "${RANGE}" | head -n 80
              echo
            else
              git log --pretty=format:'- %s (%h)' -n 20
              echo
            fi
            echo
            echo "### Notes"
            echo
            echo "- Unsigned CI artifacts (prerelease)."
            echo "- Configure servers in Settings → Network, or import a deploy string from the BetterDesk panel."
            if [ "${IS_DEV}" = "true" ]; then
              echo "- This is a **development prerelease** published after an update on \`master\`."
            fi
          } > release-notes.md

          echo "Wrote release-notes.md"
          head -n 40 release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release-notes.md
          prerelease: true
          make_latest: ${{ needs.prepare.outputs.is_dev != 'true' }}
          files: |
            dist/clean/*
            dist/msi-template/*
            dist/generator-templates-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
